name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      COMPOSE_PROJECT_NAME: buscagames-ci

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Validar Compose
        run: docker compose -f compose.yaml -f compose.ci.yaml config --quiet

      - name: Construir imagem, verificar código e executar testes
        run: >-
          docker compose -f compose.yaml -f compose.ci.yaml
          up --build --abort-on-container-exit --exit-code-from tests

      - name: Exibir logs em caso de falha
        if: failure()
        run: docker compose -f compose.yaml -f compose.ci.yaml logs --no-color

      - name: Remover containers, rede e volumes de teste
        if: always()
        run: docker compose -f compose.yaml -f compose.ci.yaml down --volumes --remove-orphans
