server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    location /api/ {
        client_max_body_size 2m;
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $catalog_backend api:3001;
        proxy_pass http://$catalog_backend;
        proxy_set_header X-BuscaGames-Client-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # O Vite gera nomes com hash: estes arquivos podem ter cache longo.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Revalidar o HTML para que novas versões apontem para os assets atuais.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # React Router precisa do HTML também no acesso direto a /jogo/1.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
