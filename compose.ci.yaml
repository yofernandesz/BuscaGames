# Complemento: docker compose -f compose.yaml -f compose.ci.yaml ...
services:
  api:
    restart: "no"
  app:
    # No CI, uma falha deve encerrar a execução, sem reinício automático.
    restart: "no"

  tests:
    # Reutiliza Node e dependências da etapa build do Dockerfile existente.
    image: buscagames-tests:1.0
    pull_policy: never
    build:
      context: .
      target: build
    working_dir: /app
    environment:
      CI: "true"
    restart: "no"
    depends_on:
      app:
        condition: service_healthy
    # Compartilha a rede da aplicação e acessa o Nginx pelo loopback.
    # Dispensa resolução DNS entre containers durante os testes HTTP.
    network_mode: service:app
    command:
      - sh
      - -ec
      - |
        npm run lint
        npm test
        node --test /backend/test/*.test.js
        node --input-type=module -e '
          import assert from "node:assert/strict";
          const catalog = await fetch("http://127.0.0.1:8080/api/home");
          assert.equal(catalog.status, 200);
          assert.equal((await catalog.json()).sections.length, 6);
          for (const path of ["/", "/jogo/1"]) {
            const response = await fetch("http://127.0.0.1:8080" + path, {
              signal: AbortSignal.timeout(5000)
            });
            assert.equal(response.status, 200);
            const html = await response.text();
            assert.match(html, /BuscaGames/);
            const asset = html.match(/src="([^"]+\.js)"/);
            assert.ok(asset, "HTML deve apontar para o JavaScript de producao");
            const script = await fetch(new URL(asset[1], "http://127.0.0.1:8080"), {
              signal: AbortSignal.timeout(5000)
            });
            assert.equal(script.status, 200);
            assert.match(script.headers.get("content-type"), /javascript/);
            console.log("OK: HTTP 200, HTML e JavaScript em " + path);
          }
        '
